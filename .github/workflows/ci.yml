name: CI

# Railway "Wait for CI" requires a `push` trigger and looks at checks on the
# commit SHA being deployed — not the GitHub PR merge commit.
# `pull_request` (unfiltered) is what actually puts a check on every PR,
# including drafts marked ready. Existing PRs opened before this workflow
# existed never got an event; `workflow_dispatch` covers a manual backfill.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches oven/bun:1-alpine in the Dockerfiles. NOT package.json's
          # packageManager (bun@1.0.0) — that predates the bun.lock text format.
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # ponytail: typecheck+next build only. No tests exist to run; add a test
      # step here when the repo grows one.
      - run: bun run build
        env:
          NEXT_PUBLIC_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  # Token deploy (no GitHub-repo connection on Railway). Requires a Project
  # Token in repo secret RAILWAY_TOKEN — Project Settings → Tokens, scoped to
  # the production environment. Service names must match the Railway dashboard
  # (defaults: web / api / ml). Postgres and Redis are not deployed from here.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # web/api Dockerfiles COPY from the repo root (workspace lockfile +
          # packages/types). ml's Dockerfile context is apps/ml itself — uploading
          # the monorepo root makes Railpack detect Bun and fail with "No start
          # command".
          - service: web
            path: .
          - service: api
            path: .
          - service: ml
            path: apps/ml
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up "${{ matrix.path }}" --path-as-root --service "${{ matrix.service }}" --ci
