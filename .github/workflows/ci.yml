name: CI

# Checks run on every push to main and every PR. Deploying to Railway is
# manual only: run this workflow from the Actions tab on main
# (`workflow_dispatch`). The Railway services are stopped to save cost, so
# deploying on every push would fail or restart billing.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # Matches oven/bun:1-alpine in the Dockerfiles and package.json's packageManager.
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          NEXT_PUBLIC_AUTH_URL: http://localhost:3000
          NEXT_TELEMETRY_DISABLED: "1"

  ml-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/ml/requirements.txt
      # CPU-only torch first, same as apps/ml/Dockerfile (tabicl pulls torch).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src api scripts
      # The contract scripts that need no database.
      - run: python scripts/verify_promotion_policy.py
      - run: python scripts/verify_constants_sync.py
      - run: python scripts/verify_model_versioning.py

  # Token deploy (no GitHub-repo connection on Railway). Requires a Project
  # Token in repo secret RAILWAY_TOKEN — Project Settings → Tokens, scoped to
  # the production environment. Service names must match the Railway dashboard
  # (defaults: web / api / ml). Postgres and Redis are not deployed from here.
  deploy:
    needs: [build, ml-check]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # web/api Dockerfiles COPY from the repo root (workspace lockfile +
          # packages/types). ml's Dockerfile context is apps/ml itself — uploading
          # the monorepo root makes Railpack detect Bun and fail with "No start
          # command".
          - service: web
            path: .
          - service: api
            path: .
          - service: ml
            path: apps/ml
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: Deploy ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up "${{ matrix.path }}" --path-as-root --service "${{ matrix.service }}" --ci
