<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moby · หน้าลูกค้า (ต้นแบบ v5)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} *{box-sizing:border-box}</style>
<!--
  Reference prototype for Claude Code. Two pages in one file:
    #list   = /customers          (รายชื่อลูกค้า)
    #detail = /customers/[id]     (บัญชี #10482)
  Markup is the canvas design as-is (inline styles); a ~60-line runtime at the bottom renders it.
  All figures are sample data except where CUSTOMER-PAGES.md says otherwise.
  Implement in apps/web with the project's tokens and components (docs/ui/DESIGN.md), not by copying inline styles.
-->
</head>
<body>
<div id="root"></div>
<template id="tpl-list">
<div style="min-height: 100vh; background: #FFFFFF; color: #111318; font-family: {{fontFamily}}; display: flex; flex-wrap: wrap; align-items: stretch;">

<aside style="flex: 1 1 232px; box-sizing: border-box; padding: 28px 16px 24px; border-right: 1px solid #E8E9ED; display: flex; flex-direction: column; gap: 32px;">
<a href="#" style="display: flex; align-items: baseline; gap: 8px; padding: 0 12px; text-decoration: none; color: #111318;"><span style="font-size: 28px; font-weight: 600; line-height: 1;">Moby</span><span style="font-size: 13px; color: #636A77;">Analytics</span></a>
<nav aria-label="เมนูหลัก" style="display: flex; flex-direction: column; gap: 4px;">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>ภาพรวม</a>
<a href="#" aria-expanded="true" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #111318; font-size: 15px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.6.8 2.6 2.5 3 5.2"></path></svg>ลูกค้า<svg style="margin-left: auto;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; gap: 2px; margin-left: 21px; padding-left: 10px; border-left: 1px solid #E8E9ED;">
<a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #111318; background: #F2F3F5; font-size: 15px; font-weight: 500;">รายชื่อลูกค้า</a>
<a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #636A77; font-size: 15px;">กลุ่มลูกค้า</a>
</div>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg>รายงาน</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>โมเดลทำนาย</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 12l3 3 5-6"></path></svg>งานติดตาม<span style="margin-left: auto; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 6px; background: {{hl}}; color: {{hlInk}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center;">4</span></a>
</nav>
<div style="flex: 1 1 auto;"></div>
<div style="border-top: 1px solid #E8E9ED; padding-top: 16px; display: flex; flex-direction: column; gap: 4px;">
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>ตั้งค่า</a>
<a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #2E333D; font-size: 15px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"></path></svg>ช่วยเหลือ</a>
</div>
</aside>

<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column;">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 32px;">
<div role="search" style="flex: 0 1 460px; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; box-sizing: border-box; background: #F5F6F8; border-radius: 12px; color: #636A77;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input type="search" aria-label="ค้นหาลูกค้า" placeholder="ค้นหาเลขบัญชี หรือพิมพ์คำสั่ง" style="flex: 1 1 auto; min-width: 0; height: 40px; border: 0; background: transparent; font: inherit; font-size: 15px; color: #111318;">
<kbd style="font-family: inherit; font-size: 13px; padding: 4px 8px; background: #FFFFFF; border: 1px solid #E8E9ED; border-radius: 8px; color: #2E333D;">⌘ K</kbd>
</div>
<div style="display: flex; align-items: center; gap: 4px;">
<button aria-label="การแจ้งเตือน" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #2E333D; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #FC4C02; border: 2px solid #FFFFFF;"></span></button>
<span aria-hidden="true" style="width: 1px; height: 28px; background: #E8E9ED; margin: 0 10px;"></span>
<button aria-label="บัญชีผู้ใช้" style="display: flex; align-items: center; gap: 8px; min-height: 44px; border: 0; background: transparent; padding: 0; cursor: pointer; color: #2E333D;"><span style="width: 40px; height: 40px; border-radius: 50%; background: #EEF0F3; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 32px 20px; border-bottom: 1px solid #E8E9ED;">
<nav aria-label="ตำแหน่งในระบบ" style="display: flex; align-items: center; gap: 8px; font-size: 20px;">
<a href="#" style="color: #111318; text-decoration: none; font-weight: 500;">ลูกค้า</a>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
<h1 style="margin: 0; font-size: 20px; font-weight: 400; color: #636A77;">รายชื่อลูกค้า</h1>
</nav>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #636A77;">ข้อมูลทำนายรอบ<button style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #E8E9ED; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; color: #111318; cursor: pointer;">1 ม.ค. 2569<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button></div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px; padding: 0 32px 40px;">

<section aria-label="รายชื่อลูกค้า" style="flex: 999 1 620px; min-width: 0; display: flex; flex-direction: column;">

<div style="display: flex; gap: 28px; border-bottom: 1px solid #E8E9ED; overflow-x: auto;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="flex: 0 0 auto; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 2px; border: 0; border-bottom: 2px solid {{t.line}}; background: transparent; font: inherit; font-size: 15px; font-weight: {{t.weight}}; color: {{t.fg}}; cursor: pointer; white-space: nowrap;">{{t.label}}<span style="font-size: 13px; font-weight: 400; color: #636A77; font-variant-numeric: tabular-nums;">{{t.count}}</span></button>
</sc-for>
</div>

<sc-if value="{{cur.hasNote}}" hint-placeholder-val="{{ false }}">
<p style="margin: 20px 0 0; padding: 12px 16px; border-radius: 10px; background: #F5F6F8; font-size: 14px; line-height: 1.55; color: #2E333D;">{{cur.note}}</p>
</sc-if>

<div style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; background: #F5F6F8; border-radius: 12px;">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 0; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; background: {{f.bg}}; color: {{f.fg}}; font-weight: {{f.weight}};">{{f.label}}<span style="font-size: 12px; color: {{f.countFg}}; font-variant-numeric: tabular-nums;">{{f.count}}</span></button>
</sc-for>
</div>

<div style="margin-top: 24px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<div style="display: flex; align-items: center; gap: 4px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 600;">{{cur.title}}</h2>
<span style="position: relative; display: inline-flex;">
<button aria-label="คำอธิบายกลุ่มนี้" onMouseEnter="{{scopeTip.show}}" onMouseLeave="{{scopeTip.hide}}" onFocus="{{scopeTip.show}}" onBlur="{{scopeTip.hide}}" style="width: 44px; height: 44px; margin: -12px -10px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #8A909C; cursor: help; display: inline-flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path></svg></button>
<sc-if value="{{scopeTip.open}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; top: 30px; left: -12px; z-index: 20; width: 300px; padding: 12px 14px; border-radius: 12px; background: #111318; color: #FFFFFF; font-size: 13px; font-weight: 400; line-height: 1.6; box-shadow: 0 10px 28px rgba(17, 19, 24, 0.2);">{{cur.def}}</span></sc-if>
</span>
</div>
<p style="margin: 0; font-size: 14px; color: #636A77;">{{cur.sub}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px;">
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #E8E9ED; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; color: #2E333D; cursor: pointer; white-space: nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"></path></svg>เรียงตาม: {{cur.sortLabel}}</button>
<button style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 1px solid #E8E9ED; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 14px; color: #2E333D; cursor: pointer; white-space: nowrap;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>ส่งออก CSV</button>
</div>
</div>

<div style="margin-top: 16px; border: 1px solid #E8E9ED; border-radius: 14px; overflow-x: auto;">
<div style="min-width: {{cur.minW}};">
<div style="display: grid; grid-template-columns: {{cur.grid}}; gap: 12px; align-items: center; height: 48px; padding: 0 16px; background: #FAFAFB; border-bottom: 1px solid #E8E9ED; font-size: 13px; color: #636A77;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="6">
<span style="display: flex; align-items: center; gap: 4px; justify-content: {{c.justify}}; white-space: nowrap;">{{c.label}}<sc-if value="{{c.hasTip}}" hint-placeholder-val="{{ false }}"><span style="position: relative; display: inline-flex;"><button aria-label="{{c.aria}}" onMouseEnter="{{c.show}}" onMouseLeave="{{c.hide}}" onFocus="{{c.show}}" onBlur="{{c.hide}}" style="width: 44px; height: 44px; margin: -12px -14px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #8A909C; cursor: help; display: inline-flex; align-items: center; justify-content: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-5M12 8h.01"></path></svg></button><sc-if value="{{c.open}}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; top: 30px; {{c.tipSide}} z-index: 20; width: 280px; padding: 12px 14px; border-radius: 12px; background: #111318; color: #FFFFFF; font-size: 13px; line-height: 1.6; text-align: left; white-space: normal; box-shadow: 0 10px 28px rgba(17, 19, 24, 0.2);">{{c.tip}}</span></sc-if></span></sc-if></span>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="display: grid; grid-template-columns: {{r.grid}}; gap: 12px; align-items: center; width: 100%; min-height: 68px; padding: 10px 16px; box-sizing: border-box; border: 0; border-bottom: 1px solid #F0F1F3; background: {{r.bg}}; font: inherit; color: #111318; text-align: left; cursor: pointer;">
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="6">
<span style="display: flex; align-items: center; justify-content: {{c.justify}}; min-width: 0;">
<sc-if value="{{c.isAcct}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 12px; min-width: 0;"><span style="flex: 0 0 40px; height: 40px; border-radius: 10px; background: #F2F3F5; color: #2E333D; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1M10 21v-3h4v3"></path></svg></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{c.text}}</span><span style="font-size: 13px; color: #636A77; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.sub}}</span></span></span></sc-if>
<sc-if value="{{c.isPill}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; white-space: nowrap; font-variant-numeric: tabular-nums;">{{c.text}}</span></sc-if>
<sc-if value="{{c.isNum}}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right;"><span style="font-size: 15px; font-weight: {{c.weight}}; color: {{c.fg}}; font-variant-numeric: tabular-nums; white-space: nowrap;">{{c.text}}</span><sc-if value="{{c.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #636A77; white-space: nowrap; font-variant-numeric: tabular-nums;">{{c.sub}}</span></sc-if></span></sc-if>
<sc-if value="{{c.isDots}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 8px;"><span aria-hidden="true" style="display: flex; gap: 3px;"><sc-for list="{{c.months}}" as="m" hint-placeholder-count="5"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{m.bg}}; box-shadow: inset 0 0 0 1px {{m.border}};"></span></sc-for></span><span style="font-size: 13px; color: {{c.fg}}; font-variant-numeric: tabular-nums;">{{c.text}}</span></span></sc-if>
<sc-if value="{{c.isText}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: {{c.fg}}; white-space: nowrap;">{{c.text}}</span></sc-if>
</span>
</sc-for>
</button>
</sc-for>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; font-size: 13px; color: #636A77;">
<span>{{cur.showing}}</span>
<div style="display: flex; align-items: center; gap: 4px;">
<button aria-label="หน้าก่อน" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #8A909C; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button aria-current="page" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #111318; color: #FFFFFF; font: inherit; font-size: 14px; cursor: pointer;">1</button>
<button style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #2E333D; font: inherit; font-size: 14px; cursor: pointer;">2</button>
<span style="padding: 0 4px;">…</span>
<button style="min-width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #2E333D; font: inherit; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums;">{{cur.pages}}</button>
<button aria-label="หน้าถัดไป" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: #2E333D; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</div>
</section>

// Minimal runtime for the x-dc templates: {{path}} holes, <sc-for>, <sc-if>, on* event holes, setState re-render.
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) {
    const changed = Object.keys(o).some((k) => this.state[k] !== o[k]);
    Object.assign(this.state, o);
    if (changed) render();
  }
}
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope) {
  if (path === 'true') return true; if (path === 'false') return false;
  const ks = path.split('.');
  let v = scope[ks[0]];
  for (let i = 1; i < ks.length && v != null; i++) v = v[ks[i]];
  return v;
}
function interp(str, scope) { return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function whole(str) { const m = str.match(/^\{\{\s*([^}]+?)\s*\}\}$/); return m ? m[1] : null; }
function build(node, scope, out) {
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  const tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    const list = look(whole(node.getAttribute('list')), scope) || [];
    const as = node.getAttribute('as');
    list.forEach((item, i) => { const sc = Object.assign(Object.create(scope), { [as]: item, $index: i }); node.childNodes.forEach((c) => build(c, sc, out)); });
    return;
  }
  if (tag === 'sc-if') {
    if (look(whole(node.getAttribute('value')), scope)) node.childNodes.forEach((c) => build(c, scope, out));

  }
  const el = node.namespaceURI === 'http://www.w3.org/2000/svg' ? document.createElementNS(node.namespaceURI, node.tagName) : document.createElement(tag);
  for (const a of node.attributes) {
    if (a.name.startsWith('hint-')) continue;
    const w = whole(a.value);
    if (a.name.startsWith('on') && w) { const fn = look(w, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2), fn); continue; }
    el.setAttribute(a.name, interp(a.value, scope));
  }
  node.childNodes.forEach((c) => build(c, scope, el));
  out.appendChild(el);
}

  renderVals() {
    const self = this;
    const st = this.state || {};
    const lime = (this.props.accent ?? 'brand') === 'lime';
    const hl = lime ? '#E1F05A' : '#DCE8FF';
    const hlInk = lime ? '#1B1F0A' : '#0A3D91';
    const fontFamily = "'" + (this.props.font ?? 'IBM Plex Sans Thai') + "', sans-serif";
    const infoKey = st.info || '';
    const C = this.config();
    const tabKey = C[st.tab] ? st.tab : 'paid';
    const T = C[tabKey];

    const tabs = Object.keys(C).map((k) => {
      const on = k === tabKey;
      return { label: C[k].label, count: C[k].count.toLocaleString('en-US'), pick: () => self.setState({ tab: k, info: '' }), pressed: on ? 'true' : 'false', line: on ? '#111318' : 'transparent', fg: on ? '#111318' : (k === 'ghost' ? '#8A909C' : '#636A77'), weight: on ? '500' : '400' };
    });

    const fKey = st['f_' + tabKey] || 'all';
    const cur = T.filters.find((f) => f.key === fKey) || T.filters[0];
    let list = T.rows().filter(cur.test);
    const by = { A: (a, b) => b.sortA - a.sortA, B: (a, b) => a.sortB - b.sortB, E: (a, b) => a.expDays - b.expDays, S: (a, b) => b.sendDays - a.sendDays, T: (a, b) => a.stopped - b.stopped };
    list.sort(by[cur.sort]);
    list = list.slice(0, 10);
    const selId = list.some((c) => c.id === st['sel_' + tabKey]) ? st['sel_' + tabKey] : list[0].id;
    const sel = list.find((c) => c.id === selId);

    const rows = list.map((c) => ({
      cells: c.cells,
      grid: T.grid,
      pick: () => self.setState({ ['sel_' + tabKey]: c.id }),
      pressed: c.id === selId ? 'true' : 'false',
      bg: c.id === selId ? '#F4F6FA' : '#FFFFFF'
    }));

    const filters = T.filters.map((f) => {
      const on = f.key === cur.key;
      return { label: f.label, count: f.count.toLocaleString('en-US'), pick: () => self.setState({ ['f_' + tabKey]: f.key, info: '' }), pressed: on ? 'true' : 'false', bg: on ? hl : 'transparent', fg: on ? hlInk : '#2E333D', countFg: on ? hlInk : '#636A77', weight: on ? '600' : '400' };
    });

    const cols = T.cols.map((c, i) => {
      const key = 'c' + i;
      return {
        label: c[0], hasTip: !!c[1], tip: c[1] || '', aria: 'คำอธิบาย ' + c[0],
        justify: c[2] ? 'flex-end' : 'flex-start',
        tipSide: i >= T.cols.length - 2 ? 'right: -12px;' : 'left: -12px;',
        open: infoKey === key, show: () => self.setState({ info: key }), hide: () => self.setState({ info: '' })
      };
    });

    return {
      fontFamily: fontFamily, hl: hl, hlInk: hlInk,
      tabs: tabs, filters: filters, cols: cols, rows: rows,
      scopeTip: { open: infoKey === 'scope', show: () => self.setState({ info: 'scope' }), hide: () => self.setState({ info: '' }) },
      sel: Object.assign({ id: sel.id }, sel.panel, { facts: sel.panel.facts.map((x) => Object.assign({ hasSub: !!x.sub }, x)) }),
      cur: {
        title: cur.title, sub: cur.sub, def: cur.def, sortLabel: cur.sortLabel,
        grid: T.grid, minW: T.minW, hasNote: !!T.note, note: T.note || '',
        showing: 'แสดง 1–' + rows.length + ' จาก ' + cur.count.toLocaleString('en-US') + ' ราย',
        pages: String(Math.ceil(cur.count / 10))
      }
    };
  }
}

class DetailPage extends DCLogic {

    // ---------- tabs ----------

    const kpi = (rows) => rows.map((r, i) => ({ label: r[0], value: r[1], cap: r[2], fg: r[3] || '#111318', edge: i === 0 ? '0' : '1px solid #E8E9ED' }));

    const GAPS = [42, 46, 45, 45, 43];                                                   // days between the top-ups above

    const usageKpis = kpi([

    ]);

    const channels = [['SMS ส่งเอง', '70%', '#006BFF', '#111318'], ['SMS API', '30%', '#9FC3FF', '#111318'], ['OTP', '0%', '#FFFFFF', '#636A77'], ['Email', '0%', '#FFFFFF', '#636A77']].map((c) => ({ label: c[0], share: c[1], sw: c[2], fg: c[3] }));

    const payKpis = kpi([

const pages = { list: new ListPage({}), detail: new DetailPage({}) };
function current() { return location.hash === '#detail' ? 'detail' : 'list'; }
function render() {
  const key = current(), comp = pages[key];
  const tpl = document.getElementById('tpl-' + key).content;
  const root = document.getElementById('root'), frag = document.createDocumentFragment();
  const vals = comp.renderVals();
  tpl.childNodes.forEach((c) => build(c, vals, frag));
  root.replaceChildren(frag);
}
addEventListener('hashchange', () => { scrollTo(0, 0); render(); });
render();
