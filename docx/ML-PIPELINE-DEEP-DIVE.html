<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>ML Pipeline — Interactive Deep Dive</title>
    <style>
    :root {
      --bg: #040810;
      --bg2: #080f1e;
      --bg3: #0d1628;
      --line: #162035;
      --line2: #1e3050;
      --t1: #d4e4ff;
      --t2: #6a8aad;
      --t3: #2d4060;
      --wk: #34d399;
      --pg: #38bdf8;
      --py: #fbbf24;
      --red: #fb7185;
      --ely: #a78bfa;
      --acc: #60a5fa;
      --churn: #fb7185;
      --clv: #60a5fa;
      --credit: #fbbf24;
      --wb: #f472b6;
      --cv: #34d399;
      --mono: "Courier New", monospace;
    }
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, "Segoe UI", sans-serif;
      color: var(--t1);
      background: var(--bg);
    }

    /* ── TOP HEADER ── */
    #topbar {
      z-index: 100;
      display: flex;
      flex-shrink: 0;
      gap: 0;
      align-items: center;
      height: 48px;
      padding: 0 20px;
      background: rgba(4, 8, 16, 0.97);
      border-bottom: 1px solid var(--line);
    }
    .tb-logo {
      margin-right: 24px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--wk);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    .step-tabs {
      display: flex;
      flex: 1;
      gap: 2px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .step-tabs::-webkit-scrollbar {
      display: none;
    }
    .stab {
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: 0.2s;
    }
    .stab:hover {
      color: var(--t2);
      border-color: var(--line2);
    }
    .stab.on {
      color: var(--acc);
      background: rgba(96, 165, 250, 0.1);
      border-color: rgba(96, 165, 250, 0.2);
    }
    .stab.done {
      color: var(--wk);
    }
    .tb-controls {
      display: flex;
      flex-shrink: 0;
      gap: 8px;
      margin-left: 16px;
    }
    .ctrl-btn {
      padding: 5px 14px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      background: transparent;
      border: 1px solid;
      border-radius: 5px;
      transition: 0.2s;
    }
    .ctrl-play {
      color: var(--acc);
      border-color: rgba(96, 165, 250, 0.4);
    }
    .ctrl-play:hover {
      background: rgba(96, 165, 250, 0.1);
    }
    .ctrl-skip {
      color: var(--t2);
      border-color: var(--line2);
    }
    .ctrl-skip:hover {
      background: var(--bg3);
    }

    /* ── MAIN LAYOUT ── */
    #main {
      display: grid;
      flex: 1;
      grid-template-columns: 1fr 320px;
      overflow: hidden;
    }
    #canvas-wrap {
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }
    #mainCanvas {
      display: block;
    }
    #side-panel {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg2);
      border-left: 1px solid var(--line);
    }
    #side-panel::-webkit-scrollbar {
      width: 4px;
    }
    #side-panel::-webkit-scrollbar-thumb {
      background: var(--line2);
      border-radius: 2px;
    }

    /* ── SIDE PANEL CONTENT ── */
    .sp-header {
      flex-shrink: 0;
      padding: 16px 18px;
      background: var(--bg3);
      border-bottom: 1px solid var(--line);
    }
    .sp-title {
      margin-bottom: 3px;
      font-size: 13px;
      font-weight: 800;
    }
    .sp-sub {
      font-size: 11px;
      line-height: 1.5;
      color: var(--t2);
    }
    .sp-body {
      flex: 1;
      padding: 14px 16px;
    }
    .sp-section {
      margin-bottom: 18px;
    }
    .sp-section-title {
      padding-bottom: 5px;
      margin-bottom: 8px;
      font-size: 10px;
      font-weight: 800;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-bottom: 1px solid var(--line);
    }
    .info-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 11px;
      border-bottom: 1px solid rgba(22, 32, 53, 0.5);
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .ir-k {
      flex-shrink: 0;
      color: var(--t2);
    }
    .ir-v {
      font-family: var(--mono);
      font-size: 10px;
      text-align: right;
      word-break: break-all;
    }
    .code-mini {
      padding: 8px 10px;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.7;
      color: var(--t2);
      background: var(--bg3);
      border: 1px solid var(--line);
      border-radius: 5px;
    }
    .feat-mini {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .fm {
      padding: 2px 7px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--t2);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--line2);
      border-radius: 3px;
    }

    /* ── PROGRESS BAR ── */
    #prog-bar {
      position: relative;
      flex-shrink: 0;
      height: 3px;
      overflow: hidden;
      background: var(--line);
    }
    #prog-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--wk));
      transition: width 0.4s ease;
    }

    /* ── STEP LABEL ── */
    #step-label {
      position: absolute;
      bottom: 14px;
      left: 50%;
      padding: 5px 16px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--acc);
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
      background: rgba(4, 8, 16, 0.85);
      border: 1px solid var(--line2);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      transform: translateX(-50%);
    }
    #particle-count {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 5px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--t2);
      background: rgba(4, 8, 16, 0.85);
      border: 1px solid var(--line);
      border-radius: 6px;
      backdrop-filter: blur(8px);
    }
    </style>
  </head>
  <body>
    <div id="topbar">
      <div class="tb-logo">1MOBY // ML PIPELINE</div>
      <div class="step-tabs">
        <div class="stab on" id="tab0" onclick="goStep(0)">① Job Claim</div>
        <div class="stab" id="tab1" onclick="goStep(1)">② Data Load</div>
        <div class="stab" id="tab2" onclick="goStep(2)">③ Cleaning</div>
        <div class="stab" id="tab3" onclick="goStep(3)">④ Features</div>
        <div class="stab" id="tab4" onclick="goStep(4)">⑤ Lifecycle</div>
        <div class="stab" id="tab5" onclick="goStep(5)">⑥ Models</div>
        <div class="stab" id="tab6" onclick="goStep(6)">⑦ Save</div>
      </div>
      <div class="tb-controls">
        <button class="ctrl-btn ctrl-play" id="playBtn" onclick="togglePlay()">
          ▶ Play
        </button>
        <button class="ctrl-btn ctrl-skip" onclick="nextStep()">Next ›</button>
      </div>
    </div>
    <div id="prog-bar"><div id="prog-fill"></div></div>

    <div id="main">
      <div id="canvas-wrap">
        <canvas id="mainCanvas"></canvas>
        <div id="step-label">Step 1 — Arq Worker claims job from Redis</div>
        <div id="particle-count">0 rows processed</div>
      </div>
      <div id="side-panel">
        <div class="sp-header">
          <div class="sp-title" id="sp-title">Redis Job Claim</div>
          <div class="sp-sub" id="sp-sub">
            The Arq worker polls Redis and claims the job that Elysia pushed
            after the Excel upload.
          </div>
        </div>
        <div class="sp-body" id="sp-body"></div>
      </div>
    </div>

    <script>
    "use strict";
    // ═══════════════════════════════════════════════════════════════
    // CONSTANTS & SETUP
    // ═══════════════════════════════════════════════════════════════
    const C = {
      acc: "#60a5fa",
      bg: "#040810",
      bg2: "#080f1e",
      bg3: "#0d1628",
      churn: "#fb7185",
      clv: "#60a5fa",
      credit: "#fbbf24",
      cv: "#34d399",
      ely: "#a78bfa",
      gem: "#f472b6",
      line: "#162035",
      line2: "#1e3050",
      orange: "#fb923c",
      pg: "#38bdf8",
      py: "#fbbf24",
      red: "#fb7185",
      t1: "#d4e4ff",
      t2: "#6a8aad",
      t3: "#2d4060",
      wb: "#f472b6",
      wk: "#34d399",
    };

    function h2r(h, a = 1) {
      const r = Number.parseInt(h.slice(1, 3), 16),
        g = Number.parseInt(h.slice(3, 5), 16),
        b = Number.parseInt(h.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    const canvas = document.getElementById("mainCanvas");
    const ctx = canvas.getContext("2d");
    let W = 0,
      H = 0,
      dpr = 1;
    let currentStep = 0,
      playing = false,
      _playTimer = null;
    let particles = [],
      nodes = [],
      t = 0,
      _animFrame = null;
    const _rowCount = 0;

    function resize() {
      const wrap = document.getElementById("canvas-wrap");
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = `${W}px`;
      canvas.style.height = `${H}px`;
      ctx.scale(dpr, dpr);
      buildStep(currentStep);
    }

    // ═══════════════════════════════════════════════════════════════
    // UTILITY DRAW HELPERS
    // ═══════════════════════════════════════════════════════════════
    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function drawBox(
      x,
      y,
      w,
      h,
      color,
      label,
      icon = "",
      sub = "",
      glow = false
    ) {
      ctx.save();
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 20;
      }
      const g = ctx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, h2r(color, 0.18));
      g.addColorStop(1, h2r(color, 0.06));
      ctx.fillStyle = g;
      ctx.strokeStyle = h2r(color, 0.6);
      ctx.lineWidth = 1.5;
      rr(x, y, w, h, 8);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.font = "16px serif";
      ctx.textAlign = "center";
      ctx.fillStyle = color;
      ctx.fillText(icon, x + w / 2, y + h / 2 - 6);
      ctx.font = "700 11px -apple-system,sans-serif";
      ctx.fillText(label, x + w / 2, y + h / 2 + 10);
      if (sub) {
        ctx.font = "9px Courier New";
        ctx.fillStyle = h2r(color, 0.5);
        ctx.fillText(sub, x + w / 2, y + h / 2 + 22);
      }
      ctx.restore();
    }

    function drawArrow(x1, y1, x2, y2, color, label = "", dashed = false) {
      ctx.save();
      ctx.strokeStyle = h2r(color, 0.4);
      ctx.lineWidth = 1.5;
      if (dashed) {
        ctx.setLineDash([5, 5]);
      }
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.setLineDash([]);
      // arrowhead
      const angle = Math.atan2(y2 - y1, x2 - x1);
      ctx.fillStyle = h2r(color, 0.6);
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(
        x2 - 10 * Math.cos(angle - 0.4),
        y2 - 10 * Math.sin(angle - 0.4)
      );
      ctx.lineTo(
        x2 - 10 * Math.cos(angle + 0.4),
        y2 - 10 * Math.sin(angle + 0.4)
      );
      ctx.closePath();
      ctx.fill();
      if (label) {
        const mx = (x1 + x2) / 2,
          my = (y1 + y2) / 2;
        ctx.font = "9px Courier New";
        ctx.fillStyle = h2r(color, 0.5);
        ctx.textAlign = "center";
        ctx.fillText(label, mx, my - 5);
      }
      ctx.restore();
    }

    function drawLabel(x, y, text, color, size = 10, align = "center") {
      ctx.font = `600 ${size}px -apple-system,sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.fillText(text, x, y);
    }

    function drawMono(x, y, text, color, size = 10, align = "center") {
      ctx.font = `${size}px Courier New`;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.fillText(text, x, y);
    }

    function particle(x, y, tx, ty, color, speed = 0.01, size = 4, label = "") {
      return {
        color,
        done: false,
        label,
        size,
        speed,
        sx: x,
        sy: y,
        t: Math.random() * 0.1,
        tx,
        ty,
        x,
        y,
      };
    }

    // ═══════════════════════════════════════════════════════════════
    // STEP DEFINITIONS
    // ═══════════════════════════════════════════════════════════════
    const STEPS = [
      // 0 — Job Claim
      () => drawJobClaim(),
      // 1 — Data Load
      () => drawDataLoad(),
      // 2 — Cleaning
      () => drawCleaning(),
      // 3 — Features
      () => drawFeatures(),
      // 4 — Lifecycle
      () => drawLifecycle(),
      // 5 — Models
      () => drawModels(),
      // 6 — Save
      () => drawSave(),
    ];

    const SIDE_INFO = [
      // 0
      {
        body: `<div class="sp-section"><div class="sp-section-title">Job Payload</div>
    <div class="code-mini"><span style="color:var(--ely)">f</span>: <span style="color:var(--py)">"run_prediction_pipeline"</span>
    <span style="color:var(--ely)">a</span>: [run_id, model_dir]
    <span style="color:var(--ely)">et</span>: <span style="color:var(--py)">1748123456789</span> (timestamp ms)
    key: <span style="color:var(--wk)">arq:job:{uuid4_hex}</span></div>
    </div>
    <div class="sp-section"><div class="sp-section-title">Worker Settings</div>
    <div class="info-row"><span class="ir-k">max_jobs</span><span class="ir-v" style="color:var(--py)">2 concurrent</span></div>
    <div class="info-row"><span class="ir-k">job_timeout</span><span class="ir-v" style="color:var(--py)">3600s (1 hour)</span></div>
    <div class="info-row"><span class="ir-k">Redis key</span><span class="ir-v" style="color:var(--wk)">arq:queue (sorted set)</span></div>
    </div>
    <div class="sp-section"><div class="sp-section-title">First actions</div>
    <div class="code-mini"><span style="color:var(--t3)"># Worker creates:</span>
    engine = create_async_engine(DB_URL)
    Session = async_sessionmaker(engine)
    redis = aioredis.from_url(REDIS_URL)
    <span style="color:var(--t3)"># Then calls _pipeline(run_id, model_dir)</span></div></div>`,
        sub: "Elysia pushed a msgpack-encoded job to Redis. The Arq worker polls and claims it.",
        title: "Redis Job Claim",
      },
      // 1
      {
        body: `<div class="sp-section"><div class="sp-section-title">Query 1 — raw_customers</div>
    <div class="info-row"><span class="ir-k">Rows</span><span class="ir-v" style="color:var(--pg)">25,093</span></div>
    <div class="info-row"><span class="ir-k">Columns</span><span class="ir-v">acc_id, status_sms, credit_sms, credit_email, expire_sms, expire_email, status_email, join_date, last_access, last_send</span></div>
    </div>
    <div class="sp-section"><div class="sp-section-title">Query 2 — raw_payments</div>
    <div class="info-row"><span class="ir-k">Rows</span><span class="ir-v" style="color:var(--py)">13,882</span></div>
    <div class="info-row"><span class="ir-k">Unique accounts</span><span class="ir-v">4,495</span></div>
    <div class="info-row"><span class="ir-k">Columns</span><span class="ir-v">acc_id, payment_date, amount, credit_add, credit_type</span></div>
    </div>
    <div class="sp-section"><div class="sp-section-title">Query 3 — raw_usage</div>
    <div class="info-row"><span class="ir-k">Rows</span><span class="ir-v" style="color:var(--red)">76,255</span></div>
    <div class="info-row"><span class="ir-k">Date range</span><span class="ir-v">2024-01 to 2025-12</span></div>
    <div class="info-row"><span class="ir-k">Channels</span><span class="ir-v">sms · email</span></div>
    <div class="info-row"><span class="ir-k">Sources</span><span class="ir-v">bc · api · otp</span></div>
    </div>`,
        sub: "3 SQL queries fetch all raw data for this run_id. Each query returns a pandas DataFrame.",
        title: "Data Load from PostgreSQL",
      },
      // 2
      {
        body: `<div class="sp-section"><div class="sp-section-title">Timezone Strip</div>
    <div class="code-mini"><span style="color:var(--t3)"># timestamptz → naive</span>
    <span style="color:var(--red)">2026-03-31 17:00:00+07</span>
    → <span style="color:var(--wk)">2026-03-31 17:00:00</span>

    cols = expire_sms, expire_email,
           join_date, last_access,
           last_send, payment_date</div>
    </div>
    <div class="sp-section"><div class="sp-section-title">Numeric Coerce</div>
    <div class="code-mini"><span style="color:var(--t3)"># object/Decimal → float64</span>
    <span style="color:var(--red)">"23466015"</span> → <span style="color:var(--wk)">23466015.0</span>
    <span style="color:var(--red)">None</span> → <span style="color:var(--wk)">NaN</span>

    cols = credit_sms, credit_email,
           amount, credit_add</div>
    </div>
    <div class="sp-section"><div class="sp-section-title">Period Synthesis</div>
    <div class="code-mini"><span style="color:var(--t3)"># usage has year + month</span>
    <span style="color:var(--red)">year=2024, month=3</span>
    → <span style="color:var(--wk)">period = 2024-03-01</span>
    (for cutoff comparisons)</div></div>`,
        sub: "Type coercions applied immediately after loading, before any ML code runs.",
        title: "Data Cleaning",
      },
      // 3
      {
        body: `<div class="sp-section"><div class="sp-section-title">9 User Features</div>
    <div class="feat-mini">
    <span class="fm" style="color:var(--pg)">days_since_join</span>
    <span class="fm" style="color:var(--pg)">days_since_last_send</span>
    <span class="fm" style="color:var(--pg)">days_since_last_access</span>
    <span class="fm" style="color:var(--pg)">days_until_sms_expire</span>
    <span class="fm" style="color:var(--pg)">days_until_email_expire</span>
    <span class="fm" style="color:var(--pg)">credit_sms_log</span>
    <span class="fm" style="color:var(--pg)">credit_email_log</span>
    <span class="fm" style="color:var(--pg)">is_paid_sms</span>
    <span class="fm" style="color:var(--pg)">is_paid_email</span>
    </div></div>
    <div class="sp-section"><div class="sp-section-title">10 Payment Features</div>
    <div class="feat-mini">
    <span class="fm" style="color:var(--py)">pay_recency_days</span>
    <span class="fm" style="color:var(--py)">pay_frequency</span>
    <span class="fm" style="color:var(--py)">pay_monetary_log</span>
    <span class="fm" style="color:var(--py)">pay_avg_amount</span>
    <span class="fm" style="color:var(--py)">pay_total_credits</span>
    <span class="fm" style="color:var(--py)">pay_avg_interval</span>
    <span class="fm" style="color:var(--py)">pay_overdue_ratio</span>
    <span class="fm" style="color:var(--py)">pay_n_sms</span>
    <span class="fm" style="color:var(--py)">pay_n_email</span>
    <span class="fm" style="color:var(--py)">pay_tenure_days</span>
    </div></div>
    <div class="sp-section"><div class="sp-section-title">11 Usage Features</div>
    <div class="feat-mini">
    <span class="fm" style="color:var(--red)">usage_total_log</span>
    <span class="fm" style="color:var(--red)">usage_months</span>
    <span class="fm" style="color:var(--red)">usage_avg</span>
    <span class="fm" style="color:var(--red)">usage_max</span>
    <span class="fm" style="color:var(--red)">usage_std</span>
    <span class="fm" style="color:var(--red)">usage_recent_3m</span>
    <span class="fm" style="color:var(--red)">usage_prev_3m</span>
    <span class="fm" style="color:var(--red)">usage_decay_ratio</span>
    <span class="fm" style="color:var(--red)">usage_slope</span>
    <span class="fm" style="color:var(--red)">usage_sms_total</span>
    <span class="fm" style="color:var(--red)">usage_email_total</span>
    </div></div>`,

    // ═══════════════════════════════════════════════════════════════

    // ── Step 1: Data Load ──────────────────────────────────────────

    // ── Step 2: Cleaning ────────────────────────────────────────────
    const CLEAN_OPS = [
      {
        after: "Naive datetime\n2026-03-31 17:00:00",
        before: "TIMESTAMPTZ +07\n2026-03-31 17:00+07",
        col: "payment_date,\nexpire_sms/email,\njoin_date",
        color: C.pg,
        why: "Timezone strip",
      },
      {
        after: "23466015.0\n(float64)",
        before: '"23466015"\n(string)',
        col: "credit_sms,\ncredit_email",
        color: C.py,
        why: "Numeric coerce",
      },
      {
        after: "30000.0\n(float64)",
        before: 'Decimal("30000")\n(Python Decimal)',
        col: "amount,\ncredit_add",
        color: C.py,
        why: "Decimal→float",
      },
      {
        after: "period = 2024-03-01\n(Timestamp)",
        before: "Two separate\ninteger columns",
        col: "year=2024\nmonth=3",
        color: C.red,
        why: "Period synthesis",
      },
      {
        after: "0.0\n(fillna)",
        before: "NaN / None\n(after merge)",
        col: "All feature\ncolumns",
        color: C.ely,
        why: "Missing→zero",
      },
    ];
    let cleanStep = 0;

    function drawCleaning() {
      ctx.clearRect(0, 0, W, H);
      drawGrid();
      const n = CLEAN_OPS.length;
      const cardW = Math.min(160, (W - 80) / n);
      const cardH = 180;
      const startX = W / 2 - (n * cardW) / 2 + cardW * 0.05;
      const cy = H / 2;

      // Animate through cleaning ops
      cleanStep = (cleanStep + 1) % 400;
      const activeIdx = Math.floor(cleanStep / 80) % n;

      CLEAN_OPS.forEach((op, i) => {
        const x = startX + i * cardW;
        const y = cy - cardH / 2;
        const active = i === activeIdx;

        ctx.save();
        if (active) {
          ctx.shadowColor = op.color;
          ctx.shadowBlur = 16;
        }
        ctx.fillStyle = active ? h2r(op.color, 0.12) : h2r(op.color, 0.05);
        ctx.strokeStyle = active ? h2r(op.color, 0.7) : h2r(op.color, 0.25);
        ctx.lineWidth = active ? 2 : 1;
        rr(x + 4, y, cardW - 8, cardH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Column name
        ctx.font = "700 10px Courier New";
        ctx.textAlign = "center";
        ctx.fillStyle = op.color;
        op.col
          .split("\n")
          .forEach((l, li) => ctx.fillText(l, x + cardW / 2, y + 20 + li * 13));

        // Before box
        ctx.fillStyle = h2r(C.red, 0.08);
        ctx.strokeStyle = h2r(C.red, 0.3);
        ctx.lineWidth = 1;
        rr(x + 8, y + 50, cardW - 16, 50, 4);
        ctx.fill();
        ctx.stroke();
        ctx.font = "8px Courier New";
        ctx.fillStyle = h2r(C.red, 0.8);
        op.before
          .split("\n")
          .forEach((l, li) => ctx.fillText(l, x + cardW / 2, y + 67 + li * 14));

        // Arrow down
        ctx.strokeStyle = h2r(op.color, 0.5);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + cardW / 2, y + 102);
        ctx.lineTo(x + cardW / 2, y + 112);
        ctx.stroke();
        ctx.font = "700 9px -apple-system";
        ctx.fillStyle = h2r(op.color, 0.8);
        ctx.fillText(op.why, x + cardW / 2, y + 110);

        // After box
        ctx.fillStyle = h2r(C.wk, 0.08);
        ctx.strokeStyle = h2r(C.wk, 0.3);
        ctx.lineWidth = 1;
        rr(x + 8, y + 115, cardW - 16, 50, 4);
        ctx.fill();
        ctx.stroke();
        ctx.font = "8px Courier New";
        ctx.fillStyle = h2r(C.wk, 0.9);
        op.after
          .split("\n")
          .forEach((l, li) =>
            ctx.fillText(l, x + cardW / 2, y + 132 + li * 14)
          );

        // Active indicator
        if (active) {
          const pp = (cleanStep % 80) / 80;
          ctx.fillStyle = op.color;
          ctx.beginPath();
          ctx.arc(x + cardW / 2, y + 62 + pp * 50, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

      drawLabel(
        W / 2,

    function drawFeatures() {

      t++;

        mergeX = W * 0.43,

        outW = W * 0.3;
      const srcH = 100,
        srcGap = 20;

      const srcColors = [C.pg, C.py, C.red];
      const srcRows = [25_093, 13_882, 76_255];
      const totalH = FEAT_GROUPS.length * (srcH + srcGap) - srcGap;
      const startY = H / 2 - totalH / 2;

      // Draw input DataFrames
      FEAT_GROUPS.forEach((fg, i) => {
        const y = startY + i * (srcH + srcGap);

        rr(inputX, y, inW, srcH, 7);
        ctx.fill();
        ctx.stroke();
        ctx.font = "14px serif";
        ctx.textAlign = "left";
        ctx.fillStyle = srcColors[i];
        ctx.fillText(["👤", "💳", "📊"][i], inputX + 12, y + 30);

        ctx.fillStyle = srcColors[i];
        ctx.fillText(srcLabels[i], inputX + 32, y + 26);
        ctx.font = "9px Courier New";
        ctx.fillStyle = h2r(srcColors[i], 0.5);
        ctx.fillText(
          `${srcRows[i].toLocaleString()} rows`,
          inputX + 32,
          y + 40
        );
        ctx.fillText(`→ ${fg.count} features`, inputX + 14, y + 58);

        // Animated arrow to merge point
        const mx = mergeX,
          my = H / 2;
        const fx = inputX + inW,
          fy = y + srcH / 2;
        const prog = (Math.sin(t * 0.025 + i * 1.2) + 1) / 2;
        ctx.strokeStyle = h2r(srcColors[i], 0.3);
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.moveTo(fx, fy);
        ctx.bezierCurveTo(fx + 60, fy, mx - 60, my, mx, my);
        ctx.stroke();
        // particle on path
        const bx = bezier(fx, fx + 60, mx - 60, mx, prog),
          by = bezier(fy, fy, my, my, prog);
        const grd = ctx.createRadialGradient(bx, by, 0, bx, by, 5);
        grd.addColorStop(0, h2r(srcColors[i], 1));
        grd.addColorStop(1, h2r(srcColors[i], 0));
        ctx.beginPath();
        ctx.arc(bx, by, 4, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      });

      // Merge box
      drawBox(
        mergeX - 20,
        H / 2 - 45,
        40,
        90,
        C.acc,
        "merge",
        "⊕",
        "left join"

      // Output feature DataFrame

      return (
        (1 - t) ** 3 * p0 +
        3 * (1 - t) ** 2 * t * p1 +
        3 * (1 - t) * t ** 2 * p2 +
        t ** 3 * p3

      rr(barX, barY, barW, 16, 8);
      ctx.fill();
      ctx.fillStyle = h2r(C.pg, 0.7);
      rr(barX, barY, Math.max(16, barW * saveProgress), 16, 8);
      ctx.fill();
      ctx.font = "700 10px -apple-system";
      ctx.textAlign = "center";
      ctx.fillStyle = C.pg;
      ctx.fillText(
        `${savedRows.toLocaleString()} / 25,093 predictions written`,
        W / 2,
        barY + 11
      );

      // Final update line
      if (saveProgress > 0.95) {
        ctx.font = "700 11px -apple-system";
        ctx.fillStyle = C.wk;
        ctx.textAlign = "center";
        ctx.fillText(
          "✅ UPDATE prediction_runs SET status='done', model_version_id=:churn_mv_id",
          W / 2,
          H * 0.9
        );
      }

      updateUI(
        6,
        "Step 7 — Merge & Save to PostgreSQL",
        `${savedRows.toLocaleString()} / 25,093 rows written`
      );
    }

    // ═══════════════════════════════════════════════════════════════
    // SHARED HELPERS
    // ═══════════════════════════════════════════════════════════════
    function drawGrid() {
      ctx.save();
      ctx.strokeStyle = "rgba(22,32,53,.4)";
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 44) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 44) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function updateParticles() {
      particles = particles.filter((p) => !p.done);
      particles.forEach((p) => {
        p.t += p.speed;
        if (p.t >= 1) {
          p.done = true;
          return;
        }
        const x = p.sx + (p.tx - p.sx) * p.t,
          y = p.sy + (p.ty - p.sy) * p.t;
        const grd = ctx.createRadialGradient(x, y, 0, x, y, p.size);
        grd.addColorStop(0, h2r(p.color, 1));
        grd.addColorStop(1, h2r(p.color, 0));
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
      });
    }

    function updateUI(step, label, count) {
      document.getElementById("step-label").textContent = label;
      document.getElementById("particle-count").textContent = count;
      document.getElementById("prog-fill").style.width =
        `${((step + 1) / 7) * 100}%`;
    }

    // ═══════════════════════════════════════════════════════════════
    // STEP CONTROL
    // ═══════════════════════════════════════════════════════════════
    function buildStep(s) {
      particles = [];
      lcParticles = [];
      nodes = [];
      t = 0;
      if (s === 1) {
        loadedRows = {};
      }
      if (s === 5) {
        modelProgress = { churn: 0, clv: 0, conv: 0, credit: 0, winback: 0 };
      }
      if (s === 6) {
        saveProgress = 0;
        savedRows = 0;
      }

      // Update tabs
      document.querySelectorAll(".stab").forEach((el, i) => {
        el.classList.remove("on", "done");
        if (i === s) {
          el.classList.add("on");
        } else if (i < s) {
          el.classList.add("done");
        }
      });

      // Side panel
      const info = SIDE_INFO[s];
      document.getElementById("sp-title").textContent = info.title;
      document.getElementById("sp-sub").textContent = info.sub;
      document.getElementById("sp-body").innerHTML = info.body;
    }

    function goStep(s) {
      currentStep = s;
      buildStep(s);
    }
    function _nextStep() {
      if (currentStep < 6) {
        goStep(currentStep + 1);
      }
    }
    function _togglePlay() {
      playing = !playing;
      document.getElementById("playBtn").textContent = playing
        ? "⏸ Pause"
        : "▶ Play";
      if (playing && currentStep >= 6) {
        goStep(0);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // MAIN LOOP
    // ═══════════════════════════════════════════════════════════════
    let lastAuto = 0;
    function loop(ts) {
      STEPS[currentStep]();
      // Auto advance when playing
      if (playing && ts - lastAuto > 4000) {
        lastAuto = ts;
        if (currentStep < 6) {
          goStep(currentStep + 1);
        } else {
          playing = false;
          document.getElementById("playBtn").textContent = "▶ Play";
        }
      }
      _animFrame = requestAnimationFrame(loop);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("load", () => {
      resize();
      buildStep(0);
      loop(0);
    });
    </script>
  </body>
</html>
