<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>Moby ML Flow — Follow One Customer Tutorial</title>
    <style>
    :root {
      --bg: #04081c;
      --bg2: #0a1530;
      --bg3: #0f1c3a;
      --line: #1a2848;
      --line2: #243859;
      --t1: #d4e4ff;
      --t2: #7a92b8;
      --t3: #3a5278;
      --t4: #1e3050;
      --acc: #60a5fa;
      --ely: #a78bfa;
      --py: #fbbf24;
      --pg: #38bdf8;
      --wk: #34d399;
      --red: #fb7185;
      --pink: #f472b6;
      --gh: #94a3b8;
      --ch: #fb7185;
      --af: #fbbf24;
      --ap: #34d399;
      --mono: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
      --sans: -apple-system, "Segoe UI", sans-serif;
    }
    * {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }
    html,
    body {
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: var(--sans);
      font-size: 13px;
      line-height: 1.45;
      color: var(--t1);
      background: var(--bg);
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      background-image:
        linear-gradient(rgba(26, 40, 72, 0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 40, 72, 0.4) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.5;
    }

    /* ─── HEADER ─── */
    header {
      z-index: 50;
      display: flex;
      flex-shrink: 0;
      gap: 0;
      align-items: center;
      height: 54px;
      padding: 0 18px;
      background: rgba(4, 8, 28, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-right: 18px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--wk);
      letter-spacing: 0.1em;
      white-space: nowrap;
    }
    .brand .dot {
      width: 7px;
      height: 7px;
      background: var(--wk);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--wk);
      animation: blink 1.8s infinite;
    }
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.35;
      }
    }
    .brand-sub {
      font-weight: 600;
      color: var(--t3);
      letter-spacing: 0.05em;
    }

    .steps {
      display: flex;
      flex: 1;
      gap: 1px;
      padding: 0 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .steps::-webkit-scrollbar {
      display: none;
    }
    .step {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 6px 11px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: 5px;
      transition: all 0.2s;
    }
    .step:hover {
      color: var(--t2);
      background: var(--bg2);
      border-color: var(--line2);
    }
    .step.on {
      color: #000;
      background: var(--acc);
      border-color: var(--acc);
      box-shadow: 0 0 16px rgba(96, 165, 250, 0.45);
    }
    .step.done {
      color: var(--wk);
    }
    .step-n {
      font-size: 9px;
      opacity: 0.7;
    }
    .step.on .step-n {
      opacity: 1;
    }

    .controls {
      display: flex;
      flex-shrink: 0;
      gap: 6px;
      margin-left: 14px;
    }
    .btn {
      padding: 6px 13px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: transparent;
      border: 1px solid;
      border-radius: 5px;
      transition: 0.2s;
    }
    .btn-play {
      color: var(--acc);
      border-color: rgba(96, 165, 250, 0.4);
    }
    .btn-play:hover {
      background: rgba(96, 165, 250, 0.12);
    }
    .btn-play.playing {
      color: #000;
      background: var(--acc);
    }
    .btn-nav {
      color: var(--t2);
      border-color: var(--line2);
    }
    .btn-nav:hover:not(:disabled) {
      color: var(--t1);
      background: var(--bg3);
    }
    .btn-nav:disabled {
      cursor: not-allowed;
      opacity: 0.25;
    }

    /* ─── PROGRESS BAR ─── */
    #prog {
      position: relative;
      flex-shrink: 0;
      height: 2px;
      overflow: hidden;
      background: var(--line);
    }
    #prog-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--acc), var(--wk));
      transition: width 0.45s ease;
    }

    /* ─── MAIN LAYOUT ─── */
    main {
      position: relative;
      z-index: 1;
      display: grid;
      flex: 1;
      grid-template-columns: 1fr 380px;
      overflow: hidden;
    }
    @media (max-width: 1100px) {
      main {
        grid-template-columns: 1fr 320px;
      }
    }
    @media (max-width: 880px) {
      main {
        grid-template-rows: 1fr 280px;
        grid-template-columns: 1fr;
      }
    }

    /* ── LEFT: VISUAL CANVAS ── */
    #stage {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    #stage-head {
      padding: 18px 26px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--line);
    }
    .s-label {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--acc);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .s-label::before {
      content: "//";
      opacity: 0.45;
    }
    .s-title {
      margin-bottom: 5px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .s-sub {
      max-width: 680px;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--t2);
    }

    #stage-body {
      position: relative;
      flex: 1;
      padding: 24px 26px;
      overflow: auto;
    }
    #stage-body::-webkit-scrollbar {
      width: 6px;
    }
    #stage-body::-webkit-scrollbar-thumb {
      background: var(--line2);
      border-radius: 3px;
    }
    #stage-body::-webkit-scrollbar-track {
      background: var(--bg);
    }

    /* ── RIGHT: INSPECTOR PANEL ── */
    #inspect {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: var(--bg2);
      border-left: 1px solid var(--line);
    }
    #inspect::-webkit-scrollbar {
      width: 5px;
    }
    #inspect::-webkit-scrollbar-thumb {
      background: var(--line2);
      border-radius: 2px;
    }

    .ins-card {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .ins-h {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 9px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .ins-h .tag {
      padding: 2px 7px;
      margin-left: auto;
      font-size: 9px;
      color: var(--t2);
      background: var(--bg3);
      border: 1px solid var(--line2);
      border-radius: 3px;
    }

    .kv {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11.5px;
      border-bottom: 1px solid rgba(36, 56, 89, 0.4);
    }
    .kv:last-child {
      border-bottom: none;
    }
    .kv-k {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--t2);
    }
    .kv-v {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--t1);
      text-align: right;
      word-break: break-all;
    }
    .kv-v.bad {
      color: var(--red);
    }
    .kv-v.good {
      color: var(--wk);
    }
    .kv-v.new {
      padding: 1px 6px;
      color: var(--acc);
      background: rgba(96, 165, 250, 0.1);
      border-radius: 3px;
    }

    .code {
      padding: 11px 13px;
      margin-top: 6px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 10.5px;
      line-height: 1.7;
      color: var(--t2);
      white-space: pre;
      background: #020514;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .code .kw {
      color: #c084fc;
    }
    .code .fn {
      color: #7dd3fc;
    }
    .code .str {
      color: #86efac;
    }
    .code .num {
      color: #fbbf24;
    }
    .code .cm {
      font-style: italic;
      color: var(--t3);
    }
    .code .hl {
      background: rgba(251, 191, 36, 0.12);
      border-radius: 2px;
    }

    /* ── BIG-VISUAL PRIMITIVES ── */
    .flow {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .box {
      position: relative;
      min-width: 130px;
      padding: 13px 16px;
      font-family: var(--mono);
      background: var(--bg2);
      border: 1px solid var(--line2);
      border-radius: 9px;
      transition: 0.3s;
    }
    .box.hi {
      background: linear-gradient(180deg, var(--bg2), rgba(96, 165, 250, 0.06));
      border-color: var(--acc);
      box-shadow: 0 0 24px rgba(96, 165, 250, 0.25);
    }
    .box .b-lbl {
      margin-bottom: 5px;
      font-size: 9px;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .box .b-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--t1);
    }
    .box .b-tag {
      position: absolute;
      top: -9px;
      left: 12px;
      padding: 2px 7px;
      font-size: 8.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-radius: 3px;
    }

    .arr {
      position: relative;
      flex-shrink: 0;
      width: 38px;
      height: 2px;
      background: linear-gradient(90deg, var(--line2), var(--acc));
    }
    .arr::after {
      position: absolute;
      top: -4px;
      right: -4px;
      content: "";
      border: 5px solid transparent;
      border-left-color: var(--acc);
    }
    .arr-lbl {
      position: absolute;
      top: -22px;
      left: 50%;
      padding: 1px 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--acc);
      white-space: nowrap;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 3px;
      transform: translateX(-50%);
    }

    /* Sheet table */
    .sheet {
      margin-bottom: 14px;
      overflow: hidden;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .sheet-head {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--py);
      letter-spacing: 0.04em;
      background: var(--bg3);
      border-bottom: 1px solid var(--line);
    }
    .sheet-head .badge {
      padding: 1px 6px;
      font-size: 9px;
      color: var(--py);
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 3px;
    }
    .sheet table {
      width: 100%;
      font-family: var(--mono);
      font-size: 10.5px;
      border-collapse: collapse;
    }
    .sheet th {
      padding: 7px 10px;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--t2);
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .sheet td {
      padding: 6px 10px;
      color: var(--t1);
      border-bottom: 1px solid var(--line);
    }
    .sheet tr:last-child td {
      border-bottom: none;
    }
    .sheet tr.us {
      background: rgba(96, 165, 250, 0.06);
    }
    .sheet tr.us td {
      color: var(--acc);
    }
    .cell-bad {
      color: var(--red);
      text-decoration: line-through;
      opacity: 0.6;
    }
    .cell-good {
      font-weight: 700;
      color: var(--wk);
    }
    .cell-tx {
      padding: 1px 5px;
      font-weight: 700;
      color: var(--ely);
      background: rgba(167, 139, 250, 0.12);
      border-radius: 3px;
    }

    /* Lifecycle tree */
    .tree {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
      font-family: var(--mono);
      font-size: 11px;
    }
    .tnode {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 9px 14px;
      background: var(--bg2);
      border: 1px solid var(--line2);
      border-radius: 6px;
    }
    .tnode.lit {
      background: rgba(96, 165, 250, 0.1);
      border-color: var(--acc);
    }
    .tnode.path {
      background: rgba(52, 211, 153, 0.08);
      border-color: var(--wk);
    }
    .tnode .cond {
      flex: 1;
      color: var(--t1);
    }
    .tnode .ans {
      padding: 2px 7px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--t2);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--bg3);
      border-radius: 3px;
    }
    .tnode.path .ans {
      color: var(--wk);
      background: rgba(52, 211, 153, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }
    .tnode .br {
      width: 20px;
      color: var(--t3);
    }

    /* Models grid */
    .mgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 11px;
      margin-bottom: 14px;
    }
    .mod {
      position: relative;
      padding: 12px 14px;
      background: var(--bg2);
      border: 1px solid var(--line2);
      border-radius: 9px;
      transition: 0.3s;
    }
    .mod.active {
      background: linear-gradient(180deg, var(--bg2), rgba(52, 211, 153, 0.06));
      border-color: var(--wk);
    }
    .mod.skip {
      opacity: 0.4;
    }
    .mod-head {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .mod-icon {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      font-size: 13px;
      border-radius: 5px;
    }
    .mod-name {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .mod-bucket {
      margin-top: 1px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .mod-out {
      padding-top: 8px;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--t2);
      border-top: 1px solid var(--line);
    }
    .mod-out span {
      font-weight: 700;
      color: var(--acc);
    }

    /* Pills / chips */
    .pill {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 3px 9px;
      margin-right: 4px;
      margin-bottom: 4px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      border: 1px solid;
      border-radius: 99px;
    }
    .pill.next {
      color: #00d4ff;
      background: rgba(0, 212, 255, 0.06);
      border-color: rgba(0, 212, 255, 0.35);
    }
    .pill.ely {
      color: var(--ely);
      background: rgba(167, 139, 250, 0.06);
      border-color: rgba(167, 139, 250, 0.35);
    }
    .pill.py {
      color: var(--py);
      background: rgba(251, 191, 36, 0.06);
      border-color: rgba(251, 191, 36, 0.35);
    }
    .pill.pg {
      color: var(--pg);
      background: rgba(56, 189, 248, 0.06);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .pill.wk {
      color: var(--wk);
      background: rgba(52, 211, 153, 0.06);
      border-color: rgba(52, 211, 153, 0.35);
    }

    /* Feature grid (30 features visual) */
    .fgrid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 14px 0;
    }
    .f {
      position: relative;
      padding: 6px 8px;
      font-family: var(--mono);
      font-size: 9.5px;
      text-align: center;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 5px;
      transition: 0.2s;
    }
    .f.user {
      border-color: rgba(167, 139, 250, 0.3);
    }
    .f.pay {
      border-color: rgba(251, 191, 36, 0.3);
    }
    .f.use {
      border-color: rgba(52, 211, 153, 0.3);
    }
    .f.flash {
      animation: flash 1.2s ease-out;
    }
    @keyframes flash {
      0% {
        background: var(--acc);
        color: #000;
        transform: scale(1.08);
      }
      100% {
        background: var(--bg2);
        color: var(--t1);
      }
    }
    .f .fk {
      margin-bottom: 2px;
      font-size: 8.5px;
      color: var(--t3);
      letter-spacing: 0.04em;
    }
    .f .fv {
      font-size: 11px;
      font-weight: 700;
      color: var(--t1);
    }

    /* Highlight */
    .hl-row {
      padding: 8px 12px;
      margin: 10px 0;
      font-family: var(--mono);
      font-size: 11.5px;
      background: linear-gradient(90deg, rgba(96, 165, 250, 0.08), transparent);
      border-left: 2px solid var(--acc);
      border-radius: 0 5px 5px 0;
    }
    .hl-row b {
      color: var(--acc);
    }

    /* Cleansing diff */
    .diff {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px;
      margin: 14px 0;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .diff-side {
      font-family: var(--mono);
      font-size: 10.5px;
    }
    .diff-side h4 {
      margin-bottom: 8px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .diff-side .ln {
      padding: 3px 8px;
      margin-bottom: 3px;
      border-radius: 3px;
    }
    .diff-side.b .ln {
      color: var(--red);
      background: rgba(251, 113, 133, 0.08);
    }
    .diff-side.a .ln {
      color: var(--wk);
      background: rgba(52, 211, 153, 0.08);
    }
    .diff-arr {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--acc);
    }

    /* Final prediction card */
    .pred {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .pcard {
      padding: 12px 14px;
      background: var(--bg2);
      border: 1px solid var(--line2);
      border-radius: 8px;
    }
    .pc-l {
      margin-bottom: 6px;
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--t3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .pc-v {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .pc-v.green {
      color: var(--wk);
    }
    .pc-v.blue {
      color: var(--acc);
    }
    .pc-v.pink {
      color: var(--pink);
    }
    .pc-v.yellow {
      color: var(--py);
    }
    .pc-v.red {
      color: var(--red);
    }
    .pc-sub {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--t2);
    }

    /* Stream events */
    .stream {
      padding: 12px;
      font-family: var(--mono);
      font-size: 10.5px;
      line-height: 1.8;
      background: #020514;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .ev {
      display: flex;
      gap: 10px;
      padding: 2px 0;
    }
    .ev-t {
      font-weight: 700;
      color: var(--wk);

       ════════════════════════════════════════════════════════════════ */
    let current = 0;
    let playing = false;
    let playTimer = null;

    const $ = (id) => document.getElementById(id);
    const stepsEl = $("steps");
    const stageBody = $("stage-body");
    const inspect = $("inspect");
    const sLabel = $("s-label");
    const sTitle = $("s-title");
    const sSub = $("s-sub");
    const progFill = $("prog-fill");
    const playBtn = $("play");
    const prevBtn = $("prev");
    const nextBtn = $("next");

    function buildStepTabs() {
      stepsEl.innerHTML = STAGES.map(
        (s, i) =>
          `<div class="step" data-i="${i}"><span class="step-n">${String(i + 1).padStart(2, "0")}</span>
           <span>${s.icon}</span> <span>${s.label}</span></div>`
      ).join("");
      stepsEl.querySelectorAll(".step").forEach((el) => {
        el.addEventListener("click", () => go(+el.dataset.i));
      });
    }

    function render() {
      const s = STAGES[current];

      // tabs
      stepsEl.querySelectorAll(".step").forEach((el, i) => {
        el.classList.toggle("on", i === current);
        el.classList.toggle("done", i < current);
      });

      // head
      sLabel.textContent = `Step ${current + 1} of ${STAGES.length} · ${s.label}`;
      sTitle.textContent = s.title;
      sSub.textContent = s.sub;

      // body
      stageBody.innerHTML = `<div class="fade">${s.body()}</div>`;
      inspect.innerHTML = `<div class="fade">${s.inspect()}</div>`;

      // animate feature grid if on features step
      if (s.key === "features") {
        const cells = document.querySelectorAll("#fgrid .f");
        cells.forEach((c, i) =>
          setTimeout(() => c.classList.add("flash"), i * 30)
        );
      }

      // progress
      progFill.style.width = `${((current + 1) / STAGES.length) * 100}%`;

      // nav buttons
      prevBtn.disabled = current === 0;
      nextBtn.disabled = current === STAGES.length - 1;
    }

    function go(i) {
      if (i < 0 || i >= STAGES.length) {
        return;
      }
      current = i;
      render();
    }

    function next() {
      if (current < STAGES.length - 1) {
        go(current + 1);
      } else {
        stopPlay();
      }
    }

    function startPlay() {
      playing = true;
      playBtn.classList.add("playing");
      playBtn.textContent = "⏸ Pause";
      playTimer = setInterval(() => {
        if (current >= STAGES.length - 1) {
          stopPlay();
          return;
        }
        next();
      }, 5000);
    }
    function stopPlay() {
      playing = false;
      playBtn.classList.remove("playing");
      playBtn.textContent = "▶ Auto-play";
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
    }
    playBtn.addEventListener("click", () =>
      playing ? stopPlay() : startPlay()
    );
    prevBtn.addEventListener("click", () => go(current - 1));
    nextBtn.addEventListener("click", next);

    // keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") {
        e.preventDefault();
        next();
      } else if (e.key === "ArrowLeft") {
        go(current - 1);
      } else if (e.key >= "1" && e.key <= "8") {
        go(+e.key - 1);
      }
    });

    buildStepTabs();
    render();
    </script>
